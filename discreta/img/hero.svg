<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" font-family="JetBrains Mono, Consolas, monospace" font-weight="800">
  <style>
    .bob { animation: bob 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .b2 { animation-delay: -1s; } .b3 { animation-delay: -2s; }
    .flip { animation: flip 2.4s steps(1) infinite; }
    .flip2 { animation: flip 2.4s steps(1) infinite reverse; }
    .dash { animation: dash 1.2s linear infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes flip { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -24; } }
  </style>
  <!-- grafo -->
  <g stroke="#17171c" stroke-width="5">
    <line class="dash" x1="110" y1="110" x2="320" y2="90" stroke-dasharray="12 12"/>
    <line x1="110" y1="110" x2="200" y2="270"/>
    <line x1="320" y1="90" x2="200" y2="270"/>
    <line x1="320" y1="90" x2="360" y2="250"/>
    <line x1="200" y1="270" x2="360" y2="250"/>
  </g>
  <g class="bob"><circle cx="114" cy="114" r="44" fill="#17171c"/><circle cx="110" cy="110" r="44" fill="#8fb8ff" stroke="#17171c" stroke-width="4"/><text x="110" y="124" font-size="40" text-anchor="middle" fill="#17171c">∀</text></g>
  <g class="bob b2"><circle cx="324" cy="94" r="40" fill="#17171c"/><circle cx="320" cy="90" r="40" fill="#ffcf33" stroke="#17171c" stroke-width="4"/><text x="320" y="103" font-size="36" text-anchor="middle" fill="#17171c">∃</text></g>
  <g class="bob b3"><circle cx="204" cy="274" r="48" fill="#17171c"/><circle cx="200" cy="270" r="48" fill="#b6f26b" stroke="#17171c" stroke-width="4"/>
    <text class="flip" x="200" y="284" font-size="40" text-anchor="middle" fill="#17171c">V</text>
    <text class="flip2" x="200" y="284" font-size="40" text-anchor="middle" fill="#17171c">F</text></g>
  <g class="bob b2"><circle cx="364" cy="254" r="36" fill="#17171c"/><circle cx="360" cy="250" r="36" fill="#ff7aa6" stroke="#17171c" stroke-width="4"/><text x="360" y="262" font-size="30" text-anchor="middle" fill="#17171c">%</text></g>
  <g transform="translate(26 236)"><rect x="4" y="4" width="112" height="72" rx="14" fill="#17171c"/><rect width="112" height="72" rx="14" fill="#fff" stroke="#17171c" stroke-width="4"/>
    <text x="56" y="32" font-size="18" text-anchor="middle" fill="#17171c">O(n²)</text><text x="56" y="56" font-size="14" text-anchor="middle" fill="#5c5f68">A ∪ B</text></g>
</svg>
