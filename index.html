<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matérias 2027</title>
  <meta name="description" content="Escolha a matéria: aulas visuais e interativas.">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/hub.css">
</head>
<body>
  <header class="hub-top">
    <div class="hub-brand">
      <span class="unigran" role="img" aria-label="Unigran Capital">
        <!-- SVG inline (cópia de img/unigran.svg) para o hover animar cada peça -->
        <svg class="unigran-logo" viewBox="0 0 64 64" aria-hidden="true">
          <rect class="ul-sombra" x="7" y="7" width="54" height="54" rx="15" fill="#17171c"/>
          <rect class="ul-placa" x="3" y="3" width="54" height="54" rx="15" fill="#ffffff" stroke="#17171c" stroke-width="3"/>
          <g class="ul-seta ul-azul">
            <path d="M11 29 V19 a8 8 0 0 1 8 -8 H30" fill="none" stroke="#17171c" stroke-width="7.5" stroke-linecap="round"/>
            <path d="M29 5.5 L37 11 L29 16.5 Z" fill="#17171c" stroke="#17171c" stroke-width="3.6" stroke-linejoin="round"/>
            <path d="M11 29 V19 a8 8 0 0 1 8 -8 H31" fill="none" stroke="#1f63c6" stroke-width="3.6" stroke-linecap="round"/>
            <path d="M29.6 7.2 L35 11 L29.6 14.8 Z" fill="#1f63c6" stroke="#1f63c6" stroke-width=".8" stroke-linejoin="round"/>
          </g>
          <g class="ul-seta ul-amarela">
            <path d="M49 31 V41 a8 8 0 0 1 -8 8 H30" fill="none" stroke="#17171c" stroke-width="7.5" stroke-linecap="round"/>
            <path d="M31 43.5 L23 49 L31 54.5 Z" fill="#17171c" stroke="#17171c" stroke-width="3.6" stroke-linejoin="round"/>
            <path d="M49 31 V41 a8 8 0 0 1 -8 8 H29" fill="none" stroke="#ffcf33" stroke-width="3.6" stroke-linecap="round"/>
            <path d="M30.4 45.2 L25 49 L30.4 52.8 Z" fill="#ffcf33" stroke="#ffcf33" stroke-width=".8" stroke-linejoin="round"/>
          </g>
          <path class="ul-u" d="M24 21 V30 a6 6 0 0 0 12 0 V21" fill="none" stroke="#17171c" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <span class="unigran-nome"><b>UNIGRAN</b><small>CAPITAL</small></span>
      </span>
      <b class="hub-titulo">Matérias</b>
    </div>
    <button class="btn sm" id="themeBtn">☾ Escuro</button>
  </header>

  <main class="hub">
    <section class="hub-hero">
      <span class="eyebrow">2027 · aulas visuais e interativas</span>
      <h1>Escolha a <span>matéria</span>.</h1>
      <p>Cada matéria tem sua trilha de aulas, animações e exercícios.</p>
    </section>

    <!-- cards gerados por js/hub.js -->
    <section class="subjects" id="subjects" aria-label="Matérias"></section>
  </main>

  <script src="js/hub.js"></script>
</body>
</html>
