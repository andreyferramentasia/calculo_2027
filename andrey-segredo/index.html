<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel</title>
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../nucleo/css/base.css">
  <link rel="stylesheet" href="../nucleo/css/components.css">
  <link rel="stylesheet" href="../nucleo/css/lab.css">
  <link rel="stylesheet" href="../nucleo/css/desafio.css">
  <link rel="stylesheet" href="painel.css?v=2">
</head>
<body>
  <main class="prof">
    <header class="lesson-head">
      <div class="crumb"><b>Painel do professor</b></div>
      <h1>🏆 Desafios</h1>
    </header>

    <!-- login: a senha é conferida no Google, nunca aqui -->
    <form class="d-card d-entrada prof-login" id="login" autocomplete="off">
      <label>Senha
        <input name="senha" type="password" required autocomplete="current-password">
      </label>
      <p class="d-erro" role="alert"></p>
      <button class="btn primary" type="submit">Entrar</button>
    </form>

    <section id="painel" hidden>
      <div class="prof-head">
        <label class="prof-materia">Matéria
          <select id="materia" aria-label="Matéria"></select>
        </label>
        <button class="btn sm ghost" id="sair" type="button">Sair</button>
      </div>

      <div class="prof-aviso" id="aviso" hidden></div>
      <h2 class="prof-h2">Seções</h2>
      <div class="prof-secoes" id="secoes"></div>

      <h2 class="prof-h2">Ranking</h2>
      <div class="prof-tools">
        <!-- linha 1: filtros -->
        <div class="prof-filtros">
          <label class="prof-campo">Seção
            <select id="filtro"></select>
          </label>
          <label class="prof-campo">Ano de ingresso
            <select id="ano"></select>
          </label>
          <label class="prof-campo prof-busca">Buscar aluno
            <span class="prof-busca-box">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="busca" type="search" placeholder="Digite o nome…" autocomplete="off" spellcheck="false">
            </span>
          </label>
        </div>

        <!-- linha 2: contagem + ações -->
        <div class="prof-acoes">
          <span class="muted prof-info" id="info"></span>
          <div class="prof-grupo">
            <button class="btn icon prof-ic" id="atualizar" type="button" data-tip="Atualizar agora" aria-label="Atualizar agora">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
            </button>
            <span class="prof-sep" aria-hidden="true"></span>
            <button class="btn primary prof-ic" id="csv" type="button" data-tip="Baixar planilha (CSV)" aria-label="Baixar planilha CSV">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
              <span>CSV</span>
            </button>
            <button class="btn prof-ic" id="json" type="button" data-tip="Baixar dados brutos (JSON)" aria-label="Baixar JSON">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg>
              <span>JSON</span>
            </button>
            <span class="prof-sep" aria-hidden="true"></span>
            <button class="btn prof-ic prof-limpar" id="limpar" type="button" data-tip="Limpar resultados" aria-label="Limpar resultados">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
              <span class="prof-n" id="limpar-n">0</span>
            </button>
          </div>
        </div>
      </div>
      <table class="prof-table">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <button class="btn prof-mais" id="mais" type="button" hidden>Mostrar mais</button>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script src="../nucleo/js/core/namespace.js"></script>
  <script>window.ALG.PARTIALS_BASE = '../nucleo/partials/';</script>
  <script src="../nucleo/js/core/partials.js"></script>
  <script src="../nucleo/js/core/modal.js"></script>
  <script src="../nucleo/js/api-config.js"></script>
  <script src="../nucleo/js/desafio/api.js"></script>
  <script src="painel.js?v=2"></script>
</body>
</html>
